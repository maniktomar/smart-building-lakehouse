# Databricks Asset Bundle: builds the wheel and deploys the pipeline as a serverless job.
#   databricks bundle validate
#   databricks bundle deploy            # uploads the wheel, creates/updates the job
#   databricks bundle run lakehouse_pipeline
# STATUS: written but NOT yet deployed (needs your workspace; see README "Running on Databricks").

bundle:
  name: smart-building-lakehouse

variables:
  catalog:
    description: Unity Catalog catalog (use `workspace` if you could not create smart_building)
    default: smart_building

artifacts:
  default:
    type: whl
    build: python -m build --wheel
    path: .

resources:
  jobs:
    lakehouse_pipeline:
      name: smart-building-lakehouse-${bundle.target}
      max_concurrent_runs: 1

      # Fail loudly: email on any task failure.
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ./dist/*.whl

      # One task per stage in sbl/conf/pipeline.yml, each waiting for the previous one.
      tasks:
        - task_key: reference_data
          environment_key: default
          python_wheel_task:
            package_name: smart_building_lakehouse
            entry_point: sbl-run
            parameters: ["--env", "databricks", "--catalog", "${var.catalog}", "--stage", "reference_data"]

        - task_key: extract_weather
          depends_on: [{task_key: reference_data}]
          environment_key: default
          python_wheel_task:
            package_name: smart_building_lakehouse
            entry_point: sbl-run
            parameters: ["--env", "databricks", "--catalog", "${var.catalog}", "--stage", "extract_weather"]

        - task_key: bronze
          depends_on: [{task_key: extract_weather}]
          environment_key: default
          python_wheel_task:
            package_name: smart_building_lakehouse
            entry_point: sbl-run
            parameters: ["--env", "databricks", "--catalog", "${var.catalog}", "--stage", "bronze"]

        - task_key: silver
          depends_on: [{task_key: bronze}]
          environment_key: default
          python_wheel_task:
            package_name: smart_building_lakehouse
            entry_point: sbl-run
            parameters: ["--env", "databricks", "--catalog", "${var.catalog}", "--stage", "silver"]

        - task_key: gold
          depends_on: [{task_key: silver}]
          environment_key: default
          python_wheel_task:
            package_name: smart_building_lakehouse
            entry_point: sbl-run
            parameters: ["--env", "databricks", "--catalog", "${var.catalog}", "--stage", "gold"]

        - task_key: quality
          depends_on: [{task_key: gold}]
          environment_key: default
          python_wheel_task:
            package_name: smart_building_lakehouse
            entry_point: sbl-run
            parameters: ["--env", "databricks", "--catalog", "${var.catalog}", "--stage", "quality"]

        - task_key: reconcile
          depends_on: [{task_key: quality}]
          environment_key: default
          python_wheel_task:
            package_name: smart_building_lakehouse
            entry_point: sbl-run
            parameters: ["--env", "databricks", "--catalog", "${var.catalog}", "--stage", "reconcile"]
targets:
  dev:
    mode: development
    default: true
