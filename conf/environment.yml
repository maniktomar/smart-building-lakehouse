# Where the lakehouse lives in Unity Catalog.
# If `CREATE CATALOG` is not allowed in your workspace (see docs/free-tier-check.md),
# change `catalog` to the default catalog Databricks gave you (usually `workspace`).
catalog: smart_building

schemas:
  bronze: bronze
  silver: silver
  gold: gold
  ops: ops          # audit, quality and quarantine tables

# Unity Catalog Volume used as the landing zone for raw files.
# This stands in for Azure Data Lake Storage (ADLS), which Free Edition cannot attach.
landing_volume: landing   # created in the bronze schema: /Volumes/<catalog>/bronze/landing
